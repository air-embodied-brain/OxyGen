[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "oxygen-model-extensions"
version = "0.1.0"
description = "OxyGen inference examples for Xiaomi-Robotics-0 and StarVLA"
requires-python = ">=3.12"
license = "Apache-2.0"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff.lint]
select = ["F"]
